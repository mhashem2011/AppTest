name: Build APK

# Builds a debug APK on every push to the dev branch, and on manual trigger.
# Download it from the run's "Artifacts" section (app-debug-apk).
on:
  push:
    branches:
      - claude/android-bluetooth-music-streaming-bx31fr
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Publish the APK as a Release asset for a direct, phone-friendly download
      # link (no GitHub login or unzip needed). Always points to the latest build.
      - name: Publish APK to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk hifi-radio-debug.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest hifi-radio-debug.apk \
            --title "HiFi Radio — latest debug APK" \
            --notes "Auto-built debug APK from ${{ github.sha }}. Sideload on Android (enable installing unknown apps)." \
            --target "${{ github.sha }}"
