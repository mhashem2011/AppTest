name: Build APK

on:
  push:
    branches:
      - claude/monthly-cashflow-app-cz40fz
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Stage APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Neveen.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Neveen-apk
          path: Neveen.apk
          if-no-files-found: error

      - name: Publish Release with APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete cashflow-latest --yes --cleanup-tag || true
          gh release create cashflow-latest Neveen.apk \
            --title "Neveen APK" \
            --notes "Latest debug build of the Neveen app. Download Neveen.apk below and install it on your phone (allow install from unknown sources). Commit: ${GITHUB_SHA:0:7}" \
            --target "${GITHUB_SHA}"
