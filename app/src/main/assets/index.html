<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Monthly Cashflow</title>
<style>
  :root{
    --bg:#0e1116; --card:#161b22; --card2:#1c232d; --line:#2a323d;
    --text:#e6edf3; --muted:#8b98a6; --accent:#3b82f6;
    --in:#34d399; --out:#f87171; --gold:#fbbf24; --usd:#93c5fd;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    padding:env(safe-area-inset-top) 0 96px 0;font-size:15px}
  header{position:sticky;top:0;z-index:10;background:#0e1116f2;
    padding:12px 16px 10px;border-bottom:1px solid var(--line);backdrop-filter:blur(8px);
    display:flex;align-items:center;gap:10px}
  .back{background:var(--card2);border:1px solid var(--line);color:var(--text);
    width:38px;height:38px;border-radius:10px;font-size:20px;cursor:pointer;flex:0 0 auto;
    display:none;align-items:center;justify-content:center}
  header.sub .back{display:flex}
  .htitle{min-width:0}
  .htitle h1{margin:0;font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .htitle .sub{color:var(--muted);font-size:12px;margin-top:2px}
  main{padding:14px 16px}

  /* ---- Home ---- */
  .hero{background:linear-gradient(135deg,#12233f,#0e1a2e);border:1px solid #26456f;
    border-radius:18px;padding:18px 18px 16px;margin-bottom:14px}
  .hero .hlbl{font-size:12px;color:#9fc0ea;text-transform:uppercase;letter-spacing:.6px}
  .hero .hrow{display:flex;align-items:baseline;gap:8px;margin-top:10px}
  .hero .hrow input{flex:1;min-width:0;background:transparent;border:none;border-bottom:1px solid #2f5a8f;
    color:var(--text);font-size:36px;font-weight:800;padding:2px 0;font-variant-numeric:tabular-nums;outline:none}
  .hero .hcur{color:var(--muted);font-size:15px;font-weight:700}
  .hero .husd{color:var(--usd);font-size:14px;margin-top:8px}
  .hero .hhint{color:#7fa3cf;font-size:11px;margin-top:2px}
  .projcard{display:flex;justify-content:space-between;align-items:center;background:var(--card2);
    border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:18px}
  .projcard .k{font-size:12px;color:var(--muted)}
  .projcard .k small{display:block;font-size:11px;margin-top:2px}
  .projcard .v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
  .projcard .v small{display:block;font-size:11px;font-weight:600;margin-top:2px}
  .listhdr{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:0 2px 8px}

  .mlist{display:flex;flex-direction:column;gap:10px}
  .mrow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:14px;cursor:pointer}
  .mrow:active{background:var(--card2)}
  .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
  .mrow .mid{flex:1;min-width:0}
  .mrow .mid .mn{font-size:16px;font-weight:700}
  .mrow .mid .ms{font-size:12px;color:var(--muted);margin-top:2px}
  .mrow .right{text-align:right}
  .mrow .right .rn{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
  .mrow .right .ru{font-size:11px;color:var(--usd)}
  .chev{color:var(--muted);font-size:18px;flex:0 0 auto}

  /* ---- Month page ---- */
  .sec{margin-top:16px}
  .sec .stitle{display:flex;justify-content:space-between;align-items:center;font-size:12px;
    text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:6px}
  .sec.inflow .stitle{color:var(--in)}
  .sec.outflow .stitle{color:var(--out)}
  .row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
  .row:first-child{border-top:none}
  .row .name{flex:1;min-width:0}
  .row .name input{width:100%;background:transparent;border:none;color:var(--text);font-size:14px;padding:4px 0}
  .row .amt{width:112px;text-align:right}
  .row .amt input{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:8px;
    color:var(--text);font-size:14px;text-align:right;padding:8px;font-variant-numeric:tabular-nums}
  .row .usd{width:74px;text-align:right;font-size:11px;color:var(--usd);font-variant-numeric:tabular-nums}
  .row .del{width:26px;text-align:center;color:var(--out);opacity:.7;font-size:18px;cursor:pointer;background:none;border:none}
  .add{background:none;border:1px dashed var(--line);color:var(--muted);border-radius:8px;
    padding:9px;width:100%;margin-top:8px;font-size:13px;cursor:pointer}
  .open-edit{display:flex;align-items:center;gap:10px;padding:2px 0 4px}
  .open-edit label{flex:1;color:var(--muted);font-size:13px}
  .open-edit input{width:112px;background:var(--card2);border:1px solid var(--line);border-radius:8px;
    color:var(--text);text-align:right;padding:8px;font-size:14px;font-variant-numeric:tabular-nums}
  .open-fixed{color:var(--text);font-size:14px;font-weight:600;text-align:right}
  .open-fixed span{display:block;color:var(--usd);font-size:11px;font-weight:400}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
  .stat{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;border-top:1px solid var(--line)}
  .stat:first-child{border-top:none}
  .stat .k{color:var(--muted);font-size:13px}
  .stat .v{font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
  .stat .v .u{display:block;font-size:11px;color:var(--usd);font-weight:400;text-align:right}
  .neveen{background:linear-gradient(135deg,#3a2f05,#241d02);border:1px solid #5b4a08;border-radius:14px;
    padding:14px;margin-top:16px}
  .neveen .t{color:var(--gold);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.5px}
  .neveen .g{display:flex;justify-content:space-between;margin-top:8px;font-size:14px}
  .neveen .g .v{font-weight:700;font-variant-numeric:tabular-nums}
  .pos{color:var(--in)} .neg{color:var(--out)}

  /* ---- Bottom bar ---- */
  .fab{position:fixed;left:0;right:0;bottom:0;background:#0e1116f2;border-top:1px solid var(--line);
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px;backdrop-filter:blur(8px)}
  .btn{flex:1;border:none;border-radius:12px;padding:14px;font-size:14px;font-weight:600;cursor:pointer}
  .btn.ghost{background:var(--card2);color:var(--text);border:1px solid var(--line)}
  .btn.ghost:disabled{opacity:.35}
  .btn.primary{background:var(--accent);color:#fff}
  .hint{color:var(--muted);font-size:11px;text-align:center;margin-top:4px}
</style>
</head>
<body>
<header id="hdr">
  <button class="back" id="backBtn">&#8592;</button>
  <div class="htitle">
    <h1 id="hTitle">Monthly Cashflow</h1>
    <div class="sub" id="hSub">Jul 2026 – Jan 2027 &middot; 1 USD = 3.75 SAR</div>
  </div>
</header>

<main id="main"></main>
<div class="fab" id="fab"></div>

<script>
const RATE = 3.75;              // 1 USD = 3.75 SAR
const TARGET = 90000;           // Neveen Money target (SAR)
const STORE = "cashflow.v2";   // bumped: reseeds corrected plan (salary shift + 21,500 opening)

function defaultData(){
  const salary = () => ([
    {label:"SLRY CS",   sar:12000},
    {label:"SLRY Bank", sar:4500}
  ]);
  return {
    openingBalance: 84230,   // cash on hand today (opening for Jul-26)
    months: [
      // Salaries are received at the START of the following month, so each
      // month's inflow is the previous month's pay. July's salary and the BNS
      // bonus have already been received and sit inside the opening balance,
      // so July and August carry no salary inflow.
      {key:"Jul-26", name:"July 2026",      inflows:[], outflows:[]},
      {key:"Aug-26", name:"August 2026",    inflows:[],
                                            outflows:[{label:"Maid", sar:17700}]},
      {key:"Sep-26", name:"September 2026",  inflows:salary(),
                                            outflows:[{label:"Court HSE", sar:20000},{label:"House rent", sar:43000}]},
      {key:"Oct-26", name:"October 2026",   inflows:salary(), outflows:[]},
      {key:"Nov-26", name:"November 2026",  inflows:salary(), outflows:[]},
      {key:"Dec-26", name:"December 2026",  inflows:salary(), outflows:[]},
      {key:"Jan-27", name:"January 2027",   inflows:salary(), outflows:[]}
    ]
  };
}

let data = load();
let view = "home";   // "home" or a month index (0..n)

function load(){
  try{ const s = localStorage.getItem(STORE); if(s) return JSON.parse(s); }catch(e){}
  return defaultData();
}
function save(){ try{ localStorage.setItem(STORE, JSON.stringify(data)); }catch(e){} }

const fmt = n => Math.round(n).toLocaleString("en-US");
const usd = sar => "$" + Math.round(sar/RATE).toLocaleString("en-US");
const sum = arr => arr.reduce((t,x)=> t + (Number(x.sar)||0), 0);
function escapeHtml(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function parseNum(v){ return Number(String(v).replace(/[^0-9.-]/g,""))||0; }

function compute(){
  let opening = Number(data.openingBalance)||0;
  return data.months.map(m=>{
    const inf = sum(m.inflows), outf = sum(m.outflows);
    const net = inf - outf, closing = opening + net;
    const r = {opening, inf, outf, net, closing};
    opening = closing;
    return r;
  });
}

function render(){
  if(view==="home") renderHome(); else renderMonth(view);
}

/* ---------- HOME ---------- */
function renderHome(){
  const calc = compute();
  const last = calc[calc.length-1];
  const gapEnd = last.closing - TARGET;
  const openBal = Number(data.openingBalance)||0;
  const firstName = data.months[0].name;
  const lastName = data.months[data.months.length-1].name;

  document.getElementById("hdr").classList.remove("sub");
  document.getElementById("hTitle").textContent = "Monthly Cashflow";
  document.getElementById("hSub").innerHTML = "Jul 2026 – Jan 2027 &middot; 1 USD = 3.75 SAR";

  const head = `
    <div class="hero">
      <div class="hlbl">Funds available today</div>
      <div class="hrow">
        <input type="text" inputmode="numeric" data-funds="1" value="${fmt(openBal)}">
        <span class="hcur">SAR</span>
      </div>
      <div class="husd">${usd(openBal)}</div>
      <div class="hhint">Tap to edit &middot; this is your starting cash for ${firstName}</div>
    </div>
    <div class="projcard">
      <div class="k">Projected balance<small>${lastName}</small></div>
      <div class="v">${fmt(last.closing)}
        <small style="color:var(--usd)">${usd(last.closing)}</small>
        <small class="${gapEnd>=0?'pos':'neg'}">${gapEnd>=0?"+":""}${fmt(gapEnd)} vs Neveen Money</small></div>
    </div>
    <div class="listhdr">Monthly income &amp; expenses</div>`;

  const rows = data.months.map((m,i)=>{
    const c = calc[i];
    const gap = c.closing - TARGET;
    return `<div class="mrow" data-open="${i}">
      <div class="dot" style="background:${gap>=0?'var(--in)':'var(--out)'}"></div>
      <div class="mid"><div class="mn">${m.name}</div>
        <div class="ms">+${fmt(c.inf)} in &middot; -${fmt(c.outf)} out</div></div>
      <div class="right"><div class="rn">${fmt(c.closing)}</div><div class="ru">${usd(c.closing)}</div></div>
      <div class="chev">&#8250;</div>
    </div>`;
  }).join("");

  document.getElementById("main").innerHTML = head + `<div class="mlist">${rows}</div>`;
  document.getElementById("fab").innerHTML =
    `<button class="btn ghost" id="resetBtn">Reset to plan</button>`;

  const fundsEl = document.querySelector("[data-funds]");
  if(fundsEl) fundsEl.addEventListener("change",()=>{
    data.openingBalance = parseNum(fundsEl.value); save(); render();
  });
  document.querySelectorAll("[data-open]").forEach(el=>{
    el.addEventListener("click",()=>{ view=+el.dataset.open; scrollTo(0,0); render(); });
  });
  document.getElementById("resetBtn").addEventListener("click",()=>{
    if(confirm("Reset all values back to the original plan?")){
      data=defaultData(); save(); render();
    }
  });
}

/* ---------- MONTH PAGE ---------- */
function renderMonth(i){
  const calc = compute();
  const c = calc[i];
  const m = data.months[i];
  const gap = c.closing - TARGET;

  document.getElementById("hdr").classList.add("sub");
  document.getElementById("hTitle").textContent = m.name;
  document.getElementById("hSub").innerHTML = `Month ${i+1} of ${data.months.length} &middot; 1 USD = 3.75 SAR`;

  const openingNote = i===0
    ? "funds available today (edit on home)"
    : `carried from ${data.months[i-1].name}`;
  const openingBlock =
    `<div class="open-edit"><label>Opening balance<br><span style="font-size:11px">${openingNote}</span></label>
      <div class="open-fixed">${fmt(c.opening)}<span>${usd(c.opening)}</span></div></div>`;

  const inRows = m.inflows.map((it,j)=>lineRow(i,"inflows",j,it)).join("");
  const outRows = m.outflows.map((it,j)=>lineRow(i,"outflows",j,it)).join("");

  document.getElementById("main").innerHTML = `
    <div class="card">${openingBlock}</div>
    <div class="sec inflow">
      <div class="stitle"><span>Inflows</span><span>+${fmt(c.inf)} &middot; ${usd(c.inf)}</span></div>
      <div class="card">${inRows || '<div style="color:var(--muted);font-size:13px;padding:6px 0">No inflows</div>'}
        <button class="add" data-add="${i}" data-type="inflows">+ Add inflow</button></div>
    </div>
    <div class="sec outflow">
      <div class="stitle"><span>Outflows</span><span>-${fmt(c.outf)} &middot; ${usd(c.outf)}</span></div>
      <div class="card">${outRows || '<div style="color:var(--muted);font-size:13px;padding:6px 0">No outflows</div>'}
        <button class="add" data-add="${i}" data-type="outflows">+ Add outflow</button></div>
    </div>
    <div class="sec">
      <div class="card">
        <div class="stat"><span class="k">Net movement</span>
          <span class="v ${c.net>=0?'pos':'neg'}">${c.net>=0?"+":""}${fmt(c.net)}<span class="u">${usd(c.net)}</span></span></div>
        <div class="stat"><span class="k">Closing balance</span>
          <span class="v">${fmt(c.closing)}<span class="u">${usd(c.closing)}</span></span></div>
      </div>
    </div>
    <div class="neveen">
      <div class="t">Neveen Money target</div>
      <div class="g"><span>Target</span><span class="v">${fmt(TARGET)} &middot; ${usd(TARGET)}</span></div>
      <div class="g"><span>Gap vs target</span>
        <span class="v ${gap>=0?'pos':'neg'}">${gap>=0?"+":""}${fmt(gap)} &middot; ${gap>=0?"+":""}${usd(gap)}</span></div>
    </div>
    <div class="hint">Changes save automatically on this device</div>`;

  document.getElementById("fab").innerHTML = `
    <button class="btn ghost" id="prevBtn" ${i===0?'disabled':''}>&#8249; Prev</button>
    <button class="btn ghost" id="nextBtn" ${i===data.months.length-1?'disabled':''}>Next &#8250;</button>`;

  bindMonth();
}

function lineRow(mi,type,j,it){
  return `<div class="row">
    <div class="name"><input type="text" value="${escapeHtml(it.label)}"
        data-label="1" data-mi="${mi}" data-type="${type}" data-j="${j}" placeholder="Description"></div>
    <div class="amt"><input type="text" inputmode="numeric" value="${fmt(it.sar)}"
        data-amt="1" data-mi="${mi}" data-type="${type}" data-j="${j}"></div>
    <div class="usd">${usd(it.sar)}</div>
    <button class="del" data-del="1" data-mi="${mi}" data-type="${type}" data-j="${j}">&times;</button>
  </div>`;
}

function bindMonth(){
  document.querySelectorAll("[data-amt]").forEach(el=>{
    el.addEventListener("change",()=>{
      const {mi,type,j}=el.dataset;
      data.months[mi][type][j].sar=parseNum(el.value); save(); render();
    });
  });
  document.querySelectorAll("[data-label]").forEach(el=>{
    el.addEventListener("change",()=>{
      const {mi,type,j}=el.dataset;
      data.months[mi][type][j].label=el.value; save();
    });
  });
  document.querySelectorAll("[data-del]").forEach(el=>{
    el.addEventListener("click",()=>{
      const {mi,type,j}=el.dataset;
      data.months[mi][type].splice(+j,1); save(); render();
    });
  });
  document.querySelectorAll("[data-add]").forEach(el=>{
    el.addEventListener("click",()=>{
      const idx=+el.dataset.add, type=el.dataset.type;
      data.months[idx][type].push({label:"",sar:0}); save(); render();
    });
  });
  const prev=document.getElementById("prevBtn"), next=document.getElementById("nextBtn");
  if(prev) prev.addEventListener("click",()=>{ if(view>0){view--;scrollTo(0,0);render();} });
  if(next) next.addEventListener("click",()=>{ if(view<data.months.length-1){view++;scrollTo(0,0);render();} });
}

document.getElementById("backBtn").addEventListener("click",()=>{ view="home"; scrollTo(0,0); render(); });

render();
</script>
</body>
</html>
