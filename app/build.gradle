plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hashem.cashflow'
    compileSdk 34

    defaultConfig {
        applicationId "com.hashem.cashflow"
        minSdk 24
        targetSdk 34
        versionCode 10
        versionName "1.9"
    }

    signingConfigs {
        // Fixed debug key committed to the repo so every CI build signs with the
        // same signature -> app updates install cleanly over previous versions.
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
